name: Offline browser output and official GanttProject GUI gate
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  official-native-gui:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Standard hosted GUI and harness tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk xvfb xauth openbox xdotool imagemagick tesseract-ocr libgtk-3-0 libasound2 libxtst6 libxi6 fonts-noto-cjk poppler-utils
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Source syntax
        run: |
          python3 -m py_compile scripts/*.py
          bash -n scripts/hosted_probe.sh
          node --check web/app.js
      - name: Bounded producer and filesystem tests
        run: |
          python3 -m unittest discover -s tests -v
          npm test
      - name: Genuine GUI fixture and actual offline browser output save and reopen
        run: xvfb-run -a -s '-screen 0 1600x1100x24' bash scripts/hosted_probe.sh
      - name: Retain actual native fixture and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: off-day-kit-native-${{ github.sha }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
